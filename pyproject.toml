[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litegarden"
version = "0.1.0"
description = "Litematic terrain beautification tool: analyze, plan, compile and export terrain edits"
requires-python = ">=3.11"
dependencies = [
    "litemapy>=0.9",
    "nbtlib>=2.0",
    "numpy>=1.26",
    "Pillow>=10.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
litegarden = "litegarden.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
